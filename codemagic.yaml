workflows:
  android-apk:
    name: Hams Android APK
    environment:
      node: v22.13.1
      java: 17
    scripts:
      - name: Extract project
        script: unzip -q private_pair_chat.zip -d app
      - name: Install dependencies
        script: |
          cd app
          npx --yes pnpm@9.12.0 install --frozen-lockfile
      - name: Build Android APK
        script: |
          cd app
          npx expo prebuild --platform android --clean --non-interactive
          cd android
          ./gradlew app:assembleRelease --stacktrace --info --no-daemon
    artifacts:
      - app/android/app/build/outputs/**/*.apk
      
