workflows:
  android-apk:
    name: Hams Android APK
    environment:
      node: v22.13.1
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          rm -rf app && mkdir app
          unzip -q private_pair_chat.zip -d app
          cd app
          npx --yes pnpm@9.12.0 install --frozen-lockfile
          npx expo prebuild --platform android --clean --non-interactive
          OLD="space.manus.private.pair.chat.t20260827091834"
          SAFE="space.manus.hams.chat.t20260827091834"
          sed -i.bak "s/namespace '${OLD}'/namespace '${SAFE}'/" android/app/build.gradle
          find android/app/src/main/java -name "*.kt" -type f -exec sed -i.bak "s/^package ${OLD}$/package ${SAFE}/" {} \;
          find android -name "*.bak" -delete
          cd android
          ./gradlew app:assembleRelease --stacktrace --info --no-daemon
    artifacts:
      - app/android/app/build/outputs/**/*.apk
      
